name: Validate skill distributions

on:
  push:
  pull_request:

jobs:
  structural-validation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install developer dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Assert installer test shell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw 'Installer tests require Windows PowerShell Desktop 5.1'
          }
      - name: Unit and temporary-profile integration tests
        run: python -m unittest discover -s tests -v
      - name: Canonical structural checks
        run: python .claude/skills/test-framework/scripts/test_skills.py --skills-root .claude/skills --host canonical --json
      - name: Generated byte and inventory drift checks
        run: python scripts/build_antigravity.py --check
      - name: Portable structural checks
        run: python skills/test-framework/scripts/test_skills.py --skills-root skills --host antigravity --json
      - name: Example ledger structural checks (not semantic truth)
        run: python scripts/validate_evidence.py .claude/skills/admin/resources/claim-ledger.example.yml --json
      - name: Whitespace checks
        run: git diff --check

# This workflow does not operate Antigravity IDE or evaluate Gemini answers.
# Windows-only installer tests must explicitly report skips on other platforms.
