<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#52514e"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9a9890"/>
    </marker>
  </defs>

  <rect width="1240" height="900" fill="#fcfcfb"/>

  <!-- Title -->
  <line x1="150" y1="36" x2="420" y2="36" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="432" cy="36" r="3" fill="#2a78d6"/>
  <line x1="820" y1="36" x2="1090" y2="36" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="808" cy="36" r="3" fill="#2a78d6"/>
  <text x="620" y="48" text-anchor="middle" font-size="34" font-weight="700" fill="#0b0b0b">GOBAL ADMIN</text>
  <text x="620" y="76" text-anchor="middle" font-size="16" fill="#4a3aa7" font-weight="600">One request &#8594; the cheapest branch that answers it</text>

  <!-- Section A: routing decision -->
  <rect x="30" y="100" width="1180" height="352" rx="14" fill="#f2f5fb" stroke="#c3c2b7" stroke-width="1.5"/>
  <rect x="52" y="84" width="368" height="30" rx="15" fill="#0b0b0b"/>
  <text x="236" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.8">ROUTING &#183; STOP AT THE FIRST BRANCH THAT FITS</text>

  <rect x="52" y="228" width="130" height="96" rx="10" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <circle cx="117" cy="258" r="13" fill="none" stroke="#52514e" stroke-width="2.2"/>
  <path d="M101,288 a16,15 0 0,1 32,0" fill="none" stroke="#52514e" stroke-width="2.2"/>
  <text x="117" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">YOU</text>
  <path d="M186,276 L214,276" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="218" y="208" width="152" height="136" rx="10" fill="#2a78d6"/>
  <circle cx="294" cy="248" r="16" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <path d="M294,232 L294,264 M278,248 L310,248" stroke="#ffffff" stroke-width="2.2"/>
  <text x="294" y="292" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">admin</text>
  <text x="294" y="312" text-anchor="middle" font-size="11" fill="#d6e6fa">the only entry point</text>
  <text x="294" y="328" text-anchor="middle" font-size="11" fill="#d6e6fa">1,883 tok loaded</text>

  <path d="M374,276 C400,276 400,166 424,166" fill="none" stroke="#9a9890" stroke-width="1.6" marker-end="url(#arrowLight)"/>
  <path d="M374,276 C400,276 400,240 424,240" fill="none" stroke="#9a9890" stroke-width="1.6" marker-end="url(#arrowLight)"/>
  <path d="M374,276 C400,276 400,314 424,314" fill="none" stroke="#9a9890" stroke-width="1.6" marker-end="url(#arrowLight)"/>
  <path d="M374,276 C400,276 400,388 424,388" fill="none" stroke="#9a9890" stroke-width="1.6" marker-end="url(#arrowLight)"/>

  <rect x="428" y="136" width="756" height="60" rx="9" fill="#ffffff" stroke="#b9d9c8" stroke-width="1.5"/>
  <circle cx="458" cy="166" r="13" fill="#17915f"/>
  <text x="458" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="484" y="162" font-size="14" font-weight="700" fill="#0b0b0b">A question &#183; a lookup &#183; reading one file</text>
  <text x="484" y="181" font-size="11.5" fill="#52514e">Answered inline with WebSearch / Read / Grep, then it stops. No dispatch.</text>
  <rect x="1046" y="152" width="120" height="28" rx="14" fill="#e6f4ed"/>
  <text x="1106" y="171" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7a4f">1.9k tok</text>

  <rect x="428" y="210" width="756" height="60" rx="9" fill="#ffffff" stroke="#b9d9c8" stroke-width="1.5"/>
  <circle cx="458" cy="240" r="13" fill="#17915f"/>
  <text x="458" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="484" y="236" font-size="14" font-weight="700" fill="#0b0b0b">One skill obviously covers it</text>
  <text x="484" y="255" font-size="11.5" fill="#52514e">Invokes that skill directly &#8212; never routed through a sub-admin.</text>
  <rect x="1046" y="226" width="120" height="28" rx="14" fill="#e6f4ed"/>
  <text x="1106" y="245" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7a4f">+ 1 skill</text>

  <rect x="428" y="284" width="756" height="60" rx="9" fill="#ffffff" stroke="#c5bde8" stroke-width="1.5"/>
  <circle cx="458" cy="314" r="13" fill="#4a3aa7"/>
  <text x="458" y="319" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="484" y="310" font-size="14" font-weight="700" fill="#0b0b0b">Multi-step, inside one domain</text>
  <text x="484" y="329" font-size="11.5" fill="#52514e">Hands the whole goal to a sub-admin, which then owns it end to end.</text>
  <rect x="1046" y="300" width="120" height="28" rx="14" fill="#ece9f8"/>
  <text x="1106" y="319" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a3aa7">+ sub-admin</text>

  <rect x="428" y="358" width="756" height="60" rx="9" fill="#fff8f1" stroke="#f0c49a" stroke-width="1.5"/>
  <circle cx="458" cy="388" r="13" fill="#d9701f"/>
  <text x="458" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="484" y="384" font-size="14" font-weight="700" fill="#0b0b0b">&#8805;2 independent sub-tasks, each worth &#8805;2k of output</text>
  <text x="484" y="403" font-size="11.5" fill="#52514e">Only here does it read dispatch-protocol.md and fan out. Parallel costs ~10&#215;.</text>
  <rect x="1046" y="374" width="120" height="28" rx="14" fill="#fdeadb"/>
  <text x="1106" y="393" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b8590f">5.8k tok</text>

  <text x="428" y="438" font-size="11.5" fill="#6b6a65"><tspan font-weight="700" fill="#0b0b0b">The test that picks the branch lives in admin/SKILL.md, not in the reference</tspan> &#8212; so deciding NOT to fan out costs nothing extra.</text>

  <!-- Section B: what branch 4 does -->
  <rect x="30" y="482" width="1180" height="186" rx="14" fill="#f4f2ee" stroke="#c3c2b7" stroke-width="1.5"/>
  <rect x="52" y="466" width="312" height="30" rx="15" fill="#d9701f"/>
  <text x="208" y="487" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.8">BRANCH 4 ONLY &#183; WHAT FAN-OUT DOES</text>

  <rect x="56" y="528" width="176" height="104" rx="9" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="144" y="562" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">dispatch-protocol</text>
  <text x="144" y="584" text-anchor="middle" font-size="11" fill="#52514e">read once, on demand</text>
  <text x="144" y="602" text-anchor="middle" font-size="11" fill="#52514e">Phase 0&#8211;6 procedure</text>
  <text x="144" y="620" text-anchor="middle" font-size="11" fill="#52514e">+ worker registry</text>
  <path d="M236,580 L266,580" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="528" width="166" height="104" rx="9" fill="#4a3aa7"/>
  <text x="353" y="566" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">&#60;domain&#62;-admin</text>
  <text x="353" y="588" text-anchor="middle" font-size="11" fill="#ded9f5">writes one task spec</text>
  <text x="353" y="606" text-anchor="middle" font-size="11" fill="#ded9f5">per worker</text>
  <path d="M440,580 L470,580" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="474" y="528" width="252" height="104" rx="9" fill="#17915f"/>
  <text x="600" y="558" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">WORKERS &#183; parallel, isolated</text>
  <rect x="498" y="572" width="68" height="22" rx="5" fill="#ffffff" opacity="0.92"/>
  <rect x="566" y="572" width="68" height="22" rx="5" fill="#ffffff" opacity="0.66"/>
  <rect x="634" y="572" width="68" height="22" rx="5" fill="#ffffff" opacity="0.4"/>
  <text x="600" y="614" text-anchor="middle" font-size="11" fill="#d9f0e5">each returns a path + a &#8804;2k manifest</text>
  <path d="M730,580 L760,580" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="764" y="528" width="186" height="104" rx="9" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="857" y="562" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">SYNTHESIS</text>
  <text x="857" y="584" text-anchor="middle" font-size="11" fill="#52514e">reasons over summaries,</text>
  <text x="857" y="602" text-anchor="middle" font-size="11" fill="#52514e">not raw dumps &#8212; every</text>
  <text x="857" y="620" text-anchor="middle" font-size="11" fill="#52514e">claim cites a source id</text>
  <path d="M954,580 L984,580" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="988" y="528" width="196" height="104" rx="9" fill="#0b0b0b"/>
  <text x="1086" y="566" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">One answer</text>
  <text x="1086" y="590" text-anchor="middle" font-size="11" fill="#c9c8c3">Vietnamese prose,</text>
  <text x="1086" y="608" text-anchor="middle" font-size="11" fill="#c9c8c3">English identifiers,</text>
  <text x="1086" y="626" text-anchor="middle" font-size="11" fill="#c9c8c3">every file path listed</text>

  <!-- Section C left: domains -->
  <rect x="30" y="700" width="600" height="176" rx="14" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <rect x="52" y="684" width="222" height="30" rx="15" fill="#4a3aa7"/>
  <text x="163" y="705" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.8">6 DOMAINS &#183; 4 SUB-ADMINS</text>

  <rect x="52" y="730" width="180" height="42" rx="7" fill="#f2f5fb" stroke="#c5bde8"/>
  <text x="64" y="748" font-size="12.5" font-weight="700" fill="#0b0b0b">Research &#183; 15</text>
  <text x="64" y="764" font-size="11" fill="#4a3aa7">research-admin</text>
  <rect x="242" y="730" width="180" height="42" rx="7" fill="#f2f5fb" stroke="#c5bde8"/>
  <text x="254" y="748" font-size="12.5" font-weight="700" fill="#0b0b0b">Code &amp; Eng. &#183; 16</text>
  <text x="254" y="764" font-size="11" fill="#4a3aa7">code-admin</text>
  <rect x="432" y="730" width="180" height="42" rx="7" fill="#f2f5fb" stroke="#c5bde8"/>
  <text x="444" y="748" font-size="12.5" font-weight="700" fill="#0b0b0b">Web &amp; UI &#183; 9</text>
  <text x="444" y="764" font-size="11" fill="#4a3aa7">web-admin</text>

  <rect x="52" y="782" width="180" height="42" rx="7" fill="#f2f5fb" stroke="#c5bde8"/>
  <text x="64" y="800" font-size="12.5" font-weight="700" fill="#0b0b0b">Deploy &amp; Ops &#183; 5</text>
  <text x="64" y="816" font-size="11" fill="#4a3aa7">deploy-admin</text>
  <rect x="242" y="782" width="180" height="42" rx="7" fill="#faf9f6" stroke="#ddd9cf"/>
  <text x="254" y="800" font-size="12.5" font-weight="700" fill="#0b0b0b">Study &#183; 3</text>
  <text x="254" y="816" font-size="11" fill="#6b6a65">study-tutor doubles as one</text>
  <rect x="432" y="782" width="180" height="42" rx="7" fill="#faf9f6" stroke="#ddd9cf"/>
  <text x="444" y="800" font-size="12.5" font-weight="700" fill="#0b0b0b">Backend &amp; Sec. &#183; 2</text>
  <text x="444" y="816" font-size="11" fill="#6b6a65">none &#8212; call the worker</text>

  <text x="52" y="850" font-size="11" fill="#6b6a65">Plus Governance &#183; 12, Career &#183; 1, and the admin layer itself &#183; 3. <tspan font-weight="700" fill="#0b0b0b">66 skills in all.</tspan></text>

  <!-- Section C right: why it stays cheap -->
  <rect x="654" y="700" width="556" height="176" rx="14" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <rect x="676" y="684" width="204" height="30" rx="15" fill="#17915f"/>
  <text x="778" y="705" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.8">WHY IT STAYS CHEAP</text>

  <circle cx="686" cy="736" r="4" fill="#17915f"/>
  <text x="700" y="740" font-size="11.5" font-weight="700" fill="#0b0b0b">Raw sources never reach the admin.</text>
  <text x="700" y="756" font-size="11.5" fill="#52514e">A PDF is read inside a worker&#8217;s own context; only a path comes back.</text>

  <circle cx="686" cy="781" r="4" fill="#17915f"/>
  <text x="700" y="785" font-size="11.5" font-weight="700" fill="#0b0b0b">Cost is linear in shards, not in pages.</text>
  <text x="700" y="801" font-size="11.5" fill="#52514e">30 papers cost what 30 summaries cost, not what 600 pages cost.</text>

  <circle cx="686" cy="826" r="4" fill="#17915f"/>
  <text x="700" y="830" font-size="11.5" font-weight="700" fill="#0b0b0b">Nothing ships without passing a gate.</text>
  <text x="700" y="846" font-size="11.5" fill="#52514e">hallucination-guard &#8594; verification-before-completion &#8594; self-evaluator.</text>

  <text x="676" y="868" font-size="11" fill="#6b6a65">All 66 descriptions cost <tspan font-weight="700" fill="#0b0b0b">8.3k tokens</tspan> once per session &#8212; 4% of a 200k window.</text>
</svg>
