schema_version: 1
# These are capabilities, not an asserted Antigravity tool ABI. Confirm the
# current host exposes a capability before use; workers fall back to sequential.
documentation:
  skills: https://antigravity.google/docs/skills?tab=ide
  rules: https://antigravity.google/docs/rules?tab=ide
  plugin: https://antigravity.google/docs/plugins?tab=ide
paths:
  canonical_rules: ~/.claude/rules
  canonical_skills: ~/.claude/skills
  runtime_skills_placeholder: <skills>
  documented_global_skills: ~/.gemini/config/skills
  generated_rules: rules
  generated_skills: skills
tools:
  Read: file reading capability
  Write: file writing capability
  Edit: targeted file editing capability
  Glob: file discovery capability
  Grep: text search capability
  Bash: shell execution capability
  PowerShell: PowerShell shell capability
  Task: isolated worker capability (use sequential execution if unavailable)
  Agent: isolated worker capability (use sequential execution if unavailable)
  Skill: read and follow the selected skill instructions
  WebSearch: web search capability
  WebFetch: full source reading capability
  AskUserQuestion: ask the user a focused question
  TodoWrite: maintain a task checklist
unsupported_tools:
  - MultiEdit
  - NotebookEdit
  - TaskCreate
  - TaskUpdate
  - TaskGet
  - TaskList
  - TaskOutput
  - TaskStop
  - SendMessage
  - EnterPlanMode
  - ExitPlanMode
# Domain entity names and illustrative placeholders are data, not invocations.
literal_tool_tokens:
  knowledge-graph/references/kg-schema.md: [Task]
literal_path_examples:
  - <skills>/skill-name/scripts/file.py
  - <skills>/skill-name/...
literal_resource_examples:
  # This is an example entrypoint in a paper's external code repository.
  experiment/references/code-search.md: [scripts/eval.sh]
rules:
  evidence-first.md:
    trigger: always_on
    description: Evidence, trust boundaries, shared budgets and observable completion.
